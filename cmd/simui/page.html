<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SYCL Badge — interactive sim</title>
<style>
  :root {
    --bg: #0b0d12;
    --edge: #2a2f3a;
    --ink: #e6eaf2;
    --dim: #8b93a7;
    --accent: #ffc040;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(1200px 800px at 50% -10%, #1a1f2b, var(--bg));
    color: var(--ink);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 18px;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }
  h1 {
    font-size: 15px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--dim); margin: 0; font-weight: 600;
  }
  h1 b { color: var(--accent); font-weight: 700; }

  .console {
    display: flex; gap: 26px; align-items: center; justify-content: center;
    flex-wrap: wrap; max-width: 100%;
  }

  .screen {
    background: #000; border: 2px solid var(--edge); border-radius: 10px;
    padding: 10px; box-shadow: 0 18px 50px rgba(0,0,0,.55), inset 0 0 0 1px #000;
  }
  canvas#lcd {
    display: block; background: #000; border-radius: 3px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    transition: filter .04s linear;
  }

  .pad { display: flex; gap: 20px; align-items: center; }

  .dpad { position: relative; width: 132px; height: 132px; flex: 0 0 auto; }
  .dpad button { position: absolute; width: 46px; height: 46px; padding: 0; }
  .dpad .up    { left: 43px; top: 0; }
  .dpad .down  { left: 43px; top: 86px; }
  .dpad .left  { left: 0; top: 43px; }
  .dpad .right { left: 86px; top: 43px; }
  .dpad .click { left: 43px; top: 43px; border-radius: 50%; }

  button {
    -webkit-appearance: none; appearance: none;
    background: linear-gradient(#20242e, #171a22);
    color: var(--ink); border: 1px solid var(--edge); border-radius: 10px;
    font: 600 13px/1 ui-sans-serif, system-ui, -apple-system, sans-serif;
    cursor: pointer; touch-action: none;
    box-shadow: 0 2px 0 #0006, inset 0 1px 0 #ffffff10;
    transition: transform .04s ease, background .04s ease, box-shadow .04s ease;
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.active {
    transform: translateY(1px) scale(.97);
    background: linear-gradient(#3a4152, #2b3140);
    box-shadow: 0 0 0 1px var(--accent) inset, 0 0 18px #ffc04033;
    color: #fff;
  }

  .face { display: flex; gap: 14px; align-items: center; }
  .face button { width: 62px; height: 62px; border-radius: 50%; font-size: 17px; font-weight: 800; }
  .face .a { color: #ffd9d9; border-color: #6a2f2f; background: radial-gradient(circle at 35% 30%, #7a3232, #4a1e1e); }
  .face .b { color: #d9e6ff; border-color: #2f4a6a; background: radial-gradient(circle at 35% 30%, #2f5f9a, #1e3a5a); }
  .face .a.active { box-shadow: 0 0 22px #e05a5a99, 0 0 0 1px #ffb0b0 inset; }
  .face .b.active { box-shadow: 0 0 22px #4f8cff99, 0 0 0 1px #b0d0ff inset; }

  .sys { display: flex; flex-direction: column; gap: 8px; }
  .sys button { padding: 10px 20px; letter-spacing: .1em; border-radius: 999px; }
  .sys .start.active { box-shadow: 0 0 18px #ffc04066, 0 0 0 1px var(--accent) inset; }

  .hud { display: flex; align-items: center; gap: 16px; color: var(--dim); font-size: 12.5px; flex-wrap: wrap; justify-content: center; }
  .hud .dot { width: 8px; height: 8px; border-radius: 50%; background: #444; box-shadow: 0 0 0 1px #0006; }
  .hud .dot.on { background: #43d17a; box-shadow: 0 0 10px #43d17a99; }
  .zoom { display: inline-flex; gap: 4px; }
  .zoom button { padding: 4px 9px; border-radius: 7px; font-size: 12px; }
  .zoom button.on { color: #111; background: linear-gradient(#ffd873, #f0b93c); border-color: #b98f2a; }
  .hint { color: var(--dim); font-size: 12px; text-align: center; max-width: 720px; margin: 0; }
  .hint b { color: var(--ink); font-weight: 600; }
  .hint-cart { color: var(--dim); display: block; margin-top: 3px; }
</style>
</head>
<body>
  <h1>SYCL Badge <b>&middot;</b> interactive sim</h1>

  <div class="console">
    <div class="screen"><canvas id="lcd" width="160" height="128" tabindex="0"></canvas></div>

    <div class="pad">
      <div class="dpad" aria-label="Joystick">
        <button class="up"    data-btn="Up"    aria-label="Up">&#9650;</button>
        <button class="down"  data-btn="Down"  aria-label="Down">&#9660;</button>
        <button class="left"  data-btn="Left"  aria-label="Left">&#9664;</button>
        <button class="right" data-btn="Right" aria-label="Right">&#9654;</button>
        <button class="click" data-btn="Click" aria-label="Stick click">&#9679;</button>
      </div>
      <div class="face">
        <button class="b" data-btn="B" aria-label="B">B</button>
        <button class="a" data-btn="A" aria-label="A">A</button>
      </div>
      <div class="sys">
        <button class="select" data-btn="Select" aria-label="Select">SELECT</button>
        <button class="start"  data-btn="Start"  aria-label="Start">START</button>
      </div>
    </div>
  </div>

  <div class="hud">
    <span><span class="dot" id="link"></span> <span id="linkText">connecting&hellip;</span></span>
    <span>backlight <span id="bl">100%</span></span>
    <span class="zoom" id="zoom"></span>
  </div>

  <p class="hint">
    <b>Arrows / WASD</b> move &middot; <b>Z</b> A &middot; <b>X</b> B &middot; <b>Enter</b> start &middot;
    <b>Shift</b> select &middot; <b>C</b> stick click &middot; <b>Esc</b> release all.
    Hold <b>Start+Select</b> to leave a cart.
    <span class="hint-cart">CARD SHOW: <b>&larr;/&rarr;</b> cycle cards &middot; <b>Shift</b> overlay &middot; <b>Z</b> flash.</span>
  </p>

<script>
(function () {
  "use strict";

  var W = 160, H = 128;
  var FRAME = 1 + W * H * 4; // 1 backlight byte + RGBA8888

  var canvas = document.getElementById("lcd");
  canvas.width = W;
  canvas.height = H;
  var ctx = canvas.getContext("2d", { alpha: false });
  var image = ctx.createImageData(W, H);

  // ---- integer zoom ------------------------------------------------------
  // Default to the largest integer scale that fits the viewport; the buttons
  // pin an explicit scale.
  var scale = 4, manual = false;
  var zoomEl = document.getElementById("zoom");
  [2, 3, 4, 5, 6].forEach(function (s) {
    var b = document.createElement("button");
    b.textContent = "\u00d7" + s;
    b.addEventListener("click", function () { manual = true; setScale(s); });
    zoomEl.appendChild(b);
  });
  function setScale(s) {
    scale = s;
    canvas.style.width = (W * s) + "px";
    canvas.style.height = (H * s) + "px";
    Array.prototype.forEach.call(zoomEl.children, function (b) {
      b.classList.toggle("on", b.textContent === "\u00d7" + s);
    });
  }
  function fit() {
    if (manual) return;
    // Leave room for the control pad beside the screen on wide viewports.
    var avail = window.innerWidth > 900 ? window.innerWidth - 560 : window.innerWidth - 48;
    setScale(Math.max(2, Math.min(6, Math.floor(avail / W))));
  }
  window.addEventListener("resize", fit);
  fit();

  // ---- controls ----------------------------------------------------------
  // The bits must match cmd/simui/main.go.
  var BITS = {
    Start: 1 << 0, Select: 1 << 1, A: 1 << 2, B: 1 << 3, Click: 1 << 4,
    Up: 1 << 5, Down: 1 << 6, Left: 1 << 7, Right: 1 << 8
  };
  var mask = 0, pending = false;

  // A tap must stay visible long enough for the ~60 fps runner to sample it, or
  // a very fast click would fall between frames. Releases are therefore deferred
  // until the press has been held for MIN_PRESS_MS; a real hold (longer than
  // that) releases immediately.
  var MIN_PRESS_MS = 60;
  var pressAt = {}, releaseTimers = {};

  function flush() {
    pending = false;
    fetch("/input?b=" + mask, { method: "POST", cache: "no-store" }).catch(function () {});
  }
  function send() {
    if (pending) return;
    pending = true;
    queueMicrotask(flush);
  }
  function highlight(name, on) {
    var els = document.querySelectorAll('[data-btn="' + name + '"]');
    Array.prototype.forEach.call(els, function (el) { el.classList.toggle("active", on); });
  }
  function apply(name, on) {
    var bit = BITS[name];
    var next = on ? (mask | bit) : (mask & ~bit);
    if (next === mask) return;
    mask = next;
    send();
    highlight(name, on);
  }
  function setBtn(name, on) {
    if (!BITS[name]) return;
    if (on) {
      if (releaseTimers[name]) { clearTimeout(releaseTimers[name]); releaseTimers[name] = 0; }
      pressAt[name] = performance.now();
      apply(name, true);
    } else {
      if (releaseTimers[name]) clearTimeout(releaseTimers[name]);
      var held = performance.now() - (pressAt[name] || 0);
      releaseTimers[name] = setTimeout(function () {
        releaseTimers[name] = 0;
        apply(name, false);
      }, Math.max(0, MIN_PRESS_MS - held));
    }
  }
  function releaseAll() {
    Object.keys(releaseTimers).forEach(function (k) { clearTimeout(releaseTimers[k]); releaseTimers[k] = 0; });
    mask = 0;
    send();
    Array.prototype.forEach.call(document.querySelectorAll("[data-btn]"), function (el) {
      el.classList.remove("active");
    });
  }

  // On-screen controls: pressed for as long as the pointer is held down.
  var lastPointerAt = 0;
  Array.prototype.forEach.call(document.querySelectorAll("[data-btn]"), function (el) {
    var name = el.getAttribute("data-btn");
    el.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      lastPointerAt = performance.now();
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      setBtn(name, true);
    });
    function up(e) { e.preventDefault(); setBtn(name, false); }
    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up);
    el.addEventListener("lostpointercapture", function () { setBtn(name, false); });
    el.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    // Fallback for a plain click (keyboard activation, some automation): pulse
    // the button. A real pointer interaction already handled it, hence the
    // time-based dedupe.
    el.addEventListener("click", function (e) {
      e.preventDefault();
      if (performance.now() - lastPointerAt < 500) return;
      setBtn(name, true);
      setTimeout(function () { setBtn(name, false); }, MIN_PRESS_MS);
    });
  });

  // Keyboard. keydown/keyup give true press-and-hold, so held directions and
  // the Start+Select chord behave exactly as the physical controls do.
  var KEYS = {
    ArrowUp: "Up", KeyW: "Up",
    ArrowDown: "Down", KeyS: "Down",
    ArrowLeft: "Left", KeyA: "Left",
    ArrowRight: "Right", KeyD: "Right",
    KeyZ: "A", KeyJ: "A",
    KeyX: "B", KeyK: "B",
    KeyC: "Click",
    Enter: "Start", NumpadEnter: "Start",
    ShiftLeft: "Select", ShiftRight: "Select"
  };
  window.addEventListener("keydown", function (e) {
    if (e.code === "Escape") { releaseAll(); return; }
    var name = KEYS[e.code];
    if (!name) return;
    e.preventDefault();
    if (e.repeat) return;
    setBtn(name, true);
  });
  window.addEventListener("keyup", function (e) {
    var name = KEYS[e.code];
    if (!name) return;
    e.preventDefault();
    setBtn(name, false);
  });
  window.addEventListener("blur", releaseAll);

  // ---- frame stream ------------------------------------------------------
  var link = document.getElementById("link");
  var linkText = document.getElementById("linkText");
  var blEl = document.getElementById("bl");
  var buf = new Uint8Array(FRAME), have = 0;

  function drawFrame() {
    image.data.set(buf.subarray(1, FRAME));
    ctx.putImageData(image, 0, 0);
    canvas.style.filter = "brightness(" + (buf[0] / 255) + ")";
    var pct = Math.round((buf[0] / 255) * 100);
    var text = pct + "%";
    if (blEl.textContent !== text) blEl.textContent = text;
  }

  function read(reader) {
    return reader.read().then(function (r) {
      if (r.done) throw new Error("stream closed");
      var v = r.value, off = 0;
      while (off < v.length) {
        var n = Math.min(FRAME - have, v.length - off);
        buf.set(v.subarray(off, off + n), have);
        have += n;
        off += n;
        if (have === FRAME) { drawFrame(); have = 0; }
      }
      return read(reader);
    });
  }

  function poll() {
    fetch("/frame.bin", { cache: "no-store" }).then(function (r) { return r.arrayBuffer(); })
      .then(function (ab) {
        buf.set(new Uint8Array(ab));
        drawFrame();
        link.classList.add("on");
        linkText.textContent = "live (polling)";
        setTimeout(poll, 16);
      })
      .catch(function () {
        link.classList.remove("on");
        linkText.textContent = "connecting\u2026";
        setTimeout(connect, 500);
      });
  }

  function connect() {
    link.classList.remove("on");
    linkText.textContent = "connecting\u2026";
    fetch("/frames", { cache: "no-store" }).then(function (res) {
      if (!res.ok || !res.body) { poll(); return; }
      link.classList.add("on");
      linkText.textContent = "live";
      have = 0;
      return read(res.body.getReader());
    }).catch(function () {
      link.classList.remove("on");
      linkText.textContent = "reconnecting\u2026";
      setTimeout(connect, 500);
    });
  }
  connect();
})();
</script>
</body>
</html>
